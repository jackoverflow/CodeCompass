services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: architecture_mapper
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d architecture_mapper"]
      interval: 5s
      timeout: 5s
      retries: 10

  devcontainer:
    build:
      context: ./.devcontainer
      dockerfile: Dockerfile
    # Keeps the container alive for VS Code to attach to.
    command: sleep infinity
    init: true
    volumes:
      # Mount the project at the path devcontainer.json expects.
      - .:/workspaces/LivingArchitectureAndTechnicalDebtMapper:cached
      # Keep container-side node_modules separate from the host's.
      - frontend-node-modules:/workspaces/LivingArchitectureAndTechnicalDebtMapper/frontend/node_modules
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/architecture_mapper
      FRONTEND_ORIGIN: http://localhost:3000
    links:
      - db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
  frontend-node-modules:
